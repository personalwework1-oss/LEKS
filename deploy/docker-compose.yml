# Production stack on the server: database, messenger server, HTTPS in front.
# Settings come from /opt/leks/.env (created by setup.sh).
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: leks
      POSTGRES_DB: leks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leks"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    image: ${SERVER_IMAGE:?}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://leks:${POSTGRES_PASSWORD}@db:5432/leks
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      LEKS_HOST: ${LEKS_HOST:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

volumes:
  db:
  caddy_data:
  caddy_config:
