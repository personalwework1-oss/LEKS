# Production stack on the server: database, messenger server, HTTPS in front.
# Settings come from /opt/leks/.env (created by setup.sh).
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: leks
      POSTGRES_DB: leks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leks"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    image: ${SERVER_IMAGE:?}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://leks:${POSTGRES_PASSWORD}@db:5432/leks
      LOG_LEVEL: info
      BLOB_DIR: /data/blobs
      LIVEKIT_URL: wss://${LEKS_HOST}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
    volumes:
      - blobs:/data/blobs
    depends_on:
      db:
        condition: service_healthy

  # Calls. Host networking, because media uses a range of UDP ports.
  livekit:
    image: livekit/livekit-server:v1.13.10
    restart: unless-stopped
    network_mode: host
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${SERVER_IP:?}"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      LEKS_HOST: ${LEKS_HOST:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - server

volumes:
  db:
  blobs:
  caddy_data:
  caddy_config:
