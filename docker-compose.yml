# Local development services. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: leks
      POSTGRES_PASSWORD: leks
      POSTGRES_DB: leks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
