name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lockfiles:
    name: Lockfiles
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      # Dependencies are edited in package.json and Cargo.toml; this job keeps
      # the lockfiles in step, changing only what the edit requires.
      - name: Update lockfiles
        run: |
          pnpm install --lockfile-only
          cargo metadata --format-version 1 > /dev/null
          if ! git diff --quiet -- pnpm-lock.yaml Cargo.lock || [ -n "$(git status --porcelain -- pnpm-lock.yaml Cargo.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml Cargo.lock
            git commit -m "chore: update lockfiles"
            git pull --rebase
            git push
          fi

  node:
    name: Server and protocol
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: leks
          POSTGRES_PASSWORD: leks
          POSTGRES_DB: leks_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://leks:leks@localhost:5432/leks_test
      # The phone's encryption core as a command-line program, for the end-to-end test.
      LEKS_CRYPTO_CLI: ${{ github.workspace }}/target/release/leks-crypto-cli
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the encryption core CLI
        run: cargo build --release -p leks-crypto --bin leks-crypto-cli
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: |
          # A lockfile that lags behind package.json is fixed by the Lockfiles job.
          pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
      - name: Build
        run: pnpm --filter '!@leks/mobile' -r run build
      - name: Typecheck
        run: pnpm --filter '!@leks/mobile' -r run typecheck
      - name: Test
        run: pnpm --filter '!@leks/mobile' -r run test

  mobile:
    name: App checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
      - name: Build the shared protocol
        run: pnpm --filter @leks/protocol run build
      - name: Expo dependency versions
        working-directory: apps/mobile
        run: npx expo install --check
      - name: Typecheck
        working-directory: apps/mobile
        run: pnpm run typecheck
      - name: Tests
        working-directory: apps/mobile
        run: pnpm run test
      - name: Bundle JavaScript for iOS and Android
        working-directory: apps/mobile
        run: npx expo export --platform ios --platform android --output-dir dist

  android-app:
    name: Android app (APK)
    needs: mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Build the encryption core for Android
        run: scripts/build-native.sh android
      - name: Install
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
      - name: Build the shared protocol
        run: pnpm --filter @leks/protocol run build
      - name: Add the Firebase file for push (if the secret is set)
        working-directory: apps/mobile
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json; echo "push: on"; else echo "push: off (no GOOGLE_SERVICES_JSON secret)"; fi
      - name: Generate the native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Check the encryption core is inside the APK
        working-directory: apps/mobile/android/app/build/outputs/apk/release
        run: |
          ls -lh *.apk
          unzip -l *.apk | grep libleks_crypto.so
      - uses: actions/upload-artifact@v4
        with:
          name: leks-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14

  ios-app:
    name: iOS app (simulator build)
    needs: mobile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: Build the encryption core for iOS
        run: scripts/build-native.sh ios
      - name: Install
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
      - name: Build the shared protocol
        run: pnpm --filter @leks/protocol run build
      - name: Generate the native iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios
      - name: Build for the simulator (no signing)
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace *.xcworkspace -scheme "$(basename *.xcworkspace .xcworkspace)" \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 80
          ls -d build/Build/Products/Release-iphonesimulator/*.app && echo "app-release ios simulator build ok"

  android-smoke:
    name: Android app starts (emulator)
    needs: android-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: leks-android-apk
          path: apk
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, open and look at the first screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do sleep 2; done
            adb shell settings put global hide_error_dialogs 1
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS >/dev/null
            adb install -r apk/*.apk
            adb shell monkey -p app.leks.messenger -c android.intent.category.LAUNCHER 1
            sh -c 'for i in $(seq 1 12); do sleep 5; adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS >/dev/null; adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && adb pull /sdcard/ui.xml ui.xml >/dev/null 2>&1; if grep -q "Создать аккаунт" ui.xml || grep -q "Переписка" ui.xml; then echo found > found.txt; break; fi; done; true'
            adb exec-out screencap -p > screen.png
            adb logcat -d -s ReactNativeJS:V AndroidRuntime:E ReactNative:V > logcat.txt || true
            grep -o 'text="[^"]*"' ui.xml | grep -v 'text=""' | head -40 || true
            echo "--- app errors ---"; grep -E "FATAL|Error|Exception" logcat.txt | head -40 || true
            if grep -q "Unmatched" ui.xml; then echo "smoke: unmatched route"; exit 1; fi
            if [ ! -f found.txt ]; then echo "smoke: welcome screen not shown"; exit 1; fi
            echo "smoke: welcome screen ok"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: |
            screen.png
            ui.xml
            logcat.txt
          if-no-files-found: ignore
          retention-days: 7

  rust:
    name: Encryption core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets

  report:
    name: Report
    if: always() && github.event_name == 'push'
    needs: [node, mobile, rust]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Publish results and failed logs to the ci-logs branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          mkdir report && cd report
          {
            echo "# CI report for $SHA"
            echo
            gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
              --jq '.jobs[] | select(.status == "completed" and (.name | startswith("Report") | not)) | "- \(.name): \(.conclusion // .status)"'
          } > README.md
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.status == "completed" and (.name | startswith("Report") | not)) | "\(.id)\t\(.conclusion)\t\(.name)"' |
          while IFS=$'\t' read -r id conclusion name; do
            curl -sSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/jobs/$id/logs" -o "job-$id.full" \
              || echo "could not download the log of job $id" >> README.md
            {
              echo
              echo "## $name ($conclusion)"
              echo
              echo '```'
              grep -E "test result:|Tests +[0-9]|Tests:|Test Suites:|Test Files|✓|✗|×|FAIL|libleks_crypto\.(so|a)|app-release" "job-$id.full" | sed -E 's/^[0-9TZ:.-]+ //' | tail -n 60 || true
              echo '```'
            } >> README.md
            if [ "$conclusion" = "failure" ]; then tail -n 400 "job-$id.full" > "job-$id.log"; fi
            rm -f "job-$id.full"
          done
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "CI report for $SHA"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:ci-logs

  report-builds:
    name: Report (app builds)
    if: always() && github.event_name == 'push'
    needs: [android-app, ios-app, android-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-smoke
          path: smoke
      - name: Publish results and failed logs to the ci-logs branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          mkdir report && cp -r smoke report/ 2>/dev/null || true; cd report
          {
            echo "# CI report for $SHA"
            echo
            gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
              --jq '.jobs[] | select(.name | test("app")) | "- \(.name): \(.conclusion // .status)"'
          } > README.md
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.name | test("app")) | "\(.id)\t\(.conclusion)\t\(.name)"' |
          while IFS=$'\t' read -r id conclusion name; do
            curl -sSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/jobs/$id/logs" -o "job-$id.full" \
              || echo "could not download the log of job $id" >> README.md
            {
              echo
              echo "## $name ($conclusion)"
              echo
              echo '```'
              grep -E "test result:|FAIL|libleks_crypto\.(so|a)|app-release|push: |smoke:|text=\"|FATAL|Exception" "job-$id.full" | sed -E 's/^[0-9TZ:.-]+ //' | tail -n 60 || true
              echo '```'
            } >> README.md
            if [ "$conclusion" = "failure" ]; then tail -n 400 "job-$id.full" > "job-$id.log"; fi
            rm -f "job-$id.full"
          done
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "CI report for $SHA"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:ci-logs-builds
