name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lockfiles:
    name: Lockfiles
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      # Dependencies are edited in package.json and Cargo.toml; this job keeps
      # the lockfiles in step, changing only what the edit requires.
      - name: Update lockfiles
        run: |
          pnpm install --lockfile-only
          cargo metadata --format-version 1 > /dev/null
          if ! git diff --quiet -- pnpm-lock.yaml Cargo.lock || [ -n "$(git status --porcelain -- pnpm-lock.yaml Cargo.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml Cargo.lock
            git commit -m "chore: update lockfiles"
            git pull --rebase
            git push
          fi

  node:
    name: Server and protocol
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: leks
          POSTGRES_PASSWORD: leks
          POSTGRES_DB: leks_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://leks:leks@localhost:5432/leks_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: |
          # A lockfile that lags behind package.json is fixed by the Lockfiles job.
          pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
      - name: Build
        run: pnpm --filter '!@leks/mobile' -r run build
      - name: Typecheck
        run: pnpm --filter '!@leks/mobile' -r run typecheck
      - name: Test
        run: pnpm --filter '!@leks/mobile' -r run test

  mobile:
    name: App checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
      - name: Build the shared protocol
        run: pnpm --filter @leks/protocol run build
      - name: Expo dependency versions
        working-directory: apps/mobile
        run: npx expo install --check
      - name: Typecheck
        working-directory: apps/mobile
        run: pnpm run typecheck
      - name: Tests
        working-directory: apps/mobile
        run: pnpm run test
      - name: Bundle JavaScript for iOS and Android
        working-directory: apps/mobile
        run: npx expo export --platform ios --platform android --output-dir dist

  android-app:
    name: Android app (APK)
    needs: mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Build the encryption core for Android
        run: scripts/build-native.sh android
      - name: Install
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
      - name: Build the shared protocol
        run: pnpm --filter @leks/protocol run build
      - name: Generate the native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Check the encryption core is inside the APK
        working-directory: apps/mobile/android/app/build/outputs/apk/release
        run: |
          ls -lh *.apk
          unzip -l *.apk | grep libleks_crypto.so
      - uses: actions/upload-artifact@v4
        with:
          name: leks-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14

  ios-app:
    name: iOS app (simulator build)
    needs: mobile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: Build the encryption core for iOS
        run: scripts/build-native.sh ios
      - name: Install
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
      - name: Build the shared protocol
        run: pnpm --filter @leks/protocol run build
      - name: Generate the native iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios
      - name: Build for the simulator (no signing)
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace *.xcworkspace -scheme "$(basename *.xcworkspace .xcworkspace)" \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 80
          ls -d build/Build/Products/Release-iphonesimulator/*.app && echo "app-release ios simulator build ok"

  rust:
    name: Encryption core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets

  report:
    name: Report
    if: always() && github.event_name == 'push'
    needs: [node, mobile, android-app, ios-app, rust]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Publish results and failed logs to the ci-logs branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          mkdir report && cd report
          {
            echo "# CI report for $SHA"
            echo
            gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
              --jq '.jobs[] | select(.name != "Report") | "- \(.name): \(.conclusion // .status)"'
          } > README.md
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.name != "Report") | "\(.id)\t\(.conclusion)\t\(.name)"' |
          while IFS=$'\t' read -r id conclusion name; do
            curl -sSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/jobs/$id/logs" -o "job-$id.full" \
              || echo "could not download the log of job $id" >> README.md
            {
              echo
              echo "## $name ($conclusion)"
              echo
              echo '```'
              grep -E "test result:|Tests +[0-9]|Tests:|Test Suites:|Test Files|✓|✗|×|FAIL|libleks_crypto\.(so|a)|app-release" "job-$id.full" | sed -E 's/^[0-9TZ:.-]+ //' | tail -n 60 || true
              echo '```'
            } >> README.md
            if [ "$conclusion" = "failure" ]; then tail -n 400 "job-$id.full" > "job-$id.log"; fi
            rm -f "job-$id.full"
          done
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "CI report for $SHA"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:ci-logs
