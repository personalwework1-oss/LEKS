name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lockfiles:
    name: Lockfiles
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Create missing lockfiles
        run: |
          changed=0
          if [ ! -f pnpm-lock.yaml ]; then pnpm install --lockfile-only; changed=1; fi
          if [ ! -f Cargo.lock ]; then cargo generate-lockfile; changed=1; fi
          if [ "$changed" = 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml Cargo.lock
            git commit -m "chore: add lockfiles generated by CI"
            git push
          fi

  node:
    name: Server and protocol
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: leks
          POSTGRES_PASSWORD: leks
          POSTGRES_DB: leks_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://leks:leks@localhost:5432/leks_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  rust:
    name: Encryption core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets

  android:
    name: Encryption core for Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Build with the Android NDK
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$bin/x86_64-linux-android26-clang"
          export CC_x86_64_linux_android="$bin/x86_64-linux-android26-clang"
          export AR_x86_64_linux_android="$bin/llvm-ar"
          for target in aarch64-linux-android x86_64-linux-android; do
            cargo build --release -p leks-crypto --target "$target"
            ls -lh "target/$target/release/libleks_crypto.so"
          done

  ios:
    name: Encryption core for iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Build for iPhone and the simulator
        run: |
          for target in aarch64-apple-ios aarch64-apple-ios-sim; do
            cargo build --release -p leks-crypto --target "$target"
            ls -lh "target/$target/release/libleks_crypto.a"
          done

  report:
    name: Report
    if: always() && github.event_name == 'push'
    needs: [node, rust, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Publish results and failed logs to the ci-logs branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          mkdir report && cd report
          {
            echo "# CI report for $SHA"
            echo
            gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
              --jq '.jobs[] | select(.name != "Report") | "- \(.name): \(.conclusion // .status)"'
          } > README.md
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.name != "Report") | "\(.id)\t\(.conclusion)\t\(.name)"' |
          while IFS=$'\t' read -r id conclusion name; do
            gh api "repos/$REPO/actions/jobs/$id/logs" > "job-$id.full" 2>/dev/null || true
            {
              echo
              echo "## $name ($conclusion)"
              echo
              echo '```'
              grep -E "test result:|Tests +[0-9]|Test Files|✓|✗|×|FAIL|libleks_crypto\.(so|a)" "job-$id.full" | sed -E 's/^[0-9TZ:.-]+ //' | tail -n 60 || true
              echo '```'
            } >> README.md
            if [ "$conclusion" = "failure" ]; then tail -n 400 "job-$id.full" > "job-$id.log"; fi
            rm -f "job-$id.full"
          done
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "CI report for $SHA"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:ci-logs
