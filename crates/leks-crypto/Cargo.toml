[package]
name = "leks-crypto"
version = "0.1.0"
description = "End-to-end encryption core for the messenger, built on OpenMLS (RFC 9420)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# staticlib: linked into the iOS app; cdylib: loaded by the Android app.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
openmls = "0.9.2"
openmls_rust_crypto = "0.6.0"
openmls_basic_credential = "0.6.0"
ed25519-dalek = { version = "2.1", features = ["rand_core", "zeroize"] }
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
aes-gcm = { version = "0.10.3", features = ["stream"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"

[dev-dependencies]
tempfile = "3"

